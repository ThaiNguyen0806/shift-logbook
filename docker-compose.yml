services:
  postgres:
    image: postgres:16
    container_name: shiftlog-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - shiftlog_pgdata:/var/lib/postgresql/data

volumes:
  shiftlog_pgdata: